<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Event Registration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #161a25, #1f2533, #2b3245);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-x: hidden;
    }

    /* 🔥 DASHBOARD BUTTON */
    .admin-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #7c8db5;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      z-index: 9999;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .admin-btn:hover {
      background: #93a6d0;
      transform: scale(1.05);
    }

    .bg-circle {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.22;
      z-index: 0;
    }

    .bg1 {
      background: #7b89a8;
      top: 30px;
      left: 40px;
    }

    .bg2 {
      background: #5e7c86;
      bottom: 30px;
      right: 40px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .left-panel {
      padding: 50px 40px;
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #dbe7ff;
      font-size: 0.85rem;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .left-panel h1 {
      font-size: 2.6rem;
      margin-bottom: 16px;
    }

    .left-panel h1 span {
      color: #a7bbdf;
    }

    .left-panel p {
      margin-bottom: 28px;
      color: #d0d9e8;
    }

    .highlight {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    .right-panel {
      padding: 40px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    input, select, textarea {
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .submit-btn {
      padding: 14px;
      border-radius: 12px;
      background: #7b89a8;
      color: white;
      border: none;
      cursor: pointer;
    }

    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- 🔥 DASHBOARD BUTTON -->
  <a href="/admin.html" class="admin-btn">📊 Dashboard</a>

  <div class="bg-circle bg1"></div>
  <div class="bg-circle bg2"></div>

  <div class="container">

    <div class="left-panel">
      <div class="badge">Cloud-Ready Campus Portal</div>
      <h1>Register for the <span>next big campus event</span></h1>
      <p>Join tech fests, workshops, hackathons, and cultural events.</p>

      <div class="highlight">Fast Registration</div>
      <div class="highlight">Event Ready</div>
      <div class="highlight">Future Scalable</div>
    </div>

    <div class="right-panel">
      <h2>Student Registration Form</h2>

      <form id="form">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="text" id="studentId" placeholder="Student ID">
        <input type="text" id="department" placeholder="Department">
        <input type="email" id="email" placeholder="Email">
        <select id="year">
          <option>1st Year</option>
          <option>2nd Year</option>
        </select>
        <select id="eventName">
          <option>Tech Fest</option>
          <option>Workshop</option>
        </select>
        <textarea id="notes" placeholder="Notes"></textarea>

        <button class="submit-btn">Register</button>

        <div id="msg"></div>
      </form>
    </div>

  </div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        fullName: document.getElementById("fullName").value,
        studentId: document.getElementById("studentId").value,
        department: document.getElementById("department").value,
        email: document.getElementById("email").value,
        year: document.getElementById("year").value,
        eventName: document.getElementById("eventName").value,
        notes: document.getElementById("notes").value
      };

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      msg.innerText = result.message;
    });
  </script>

</body>
</html>
